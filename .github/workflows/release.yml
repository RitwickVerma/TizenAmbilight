name: release

# Push a tag vX.Y.Z (matching the manifest version) to publish a GitHub Release
# with the TPK attached. The TPK is signed with the Tizen SDK's DEFAULT certificate,
# which a retail TV rejects, and it is NOT installable as-is. Samsung TVs only accept a
# package signed with a certificate that embeds that TV's DUID, so a pre-signed release
# cannot exist. Apps2Samsung downloads this file and re-signs it for each user's own TV;
# the file name and release notes say so on purpose.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Tag must match the manifest version
        run: |
          manifest=$(sed -n 's/.*<manifest[^>]* version="\([^"]*\)".*/\1/p' TizenAmbilight/tizen-manifest.xml)
          if [ "v$manifest" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match manifest version $manifest" >&2
            exit 1
          fi
      - name: Checks
        run: |
          python3 tools/check-secrets.py --all
          python3 tools/check-apps2samsung.py
          dotnet run --project decoder-selftest/DecoderSelfTest.csproj
      - name: Build TPK
        run: |
          dotnet msbuild TizenAmbilight/TizenAmbilight.csproj -restore -t:Rebuild -p:Configuration=Release -v:m
          mkdir dist
          cp TizenAmbilight/bin/Release/tizen90/*.tpk "dist/TizenAmbilight-${GITHUB_REF_NAME}-default-cert.tpk"
          (cd dist && sha256sum *.tpk > SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tpk dist/SHA256SUMS \
            --title "TizenAmbilight $GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md for what changed. The attached TPK is signed with the Tizen SDK default certificate and will NOT install on a retail TV as-is: no pre-signed package can exist, because a TV only accepts a certificate that embeds its own DUID. Install with Apps2Samsung (it re-signs for your TV), or build from source and sign with your own Samsung certificate (see README, Install)."
