# Runs on the project's linked runner. One .NET job only: the build and the
# host test harness share it so two SDK containers never run side by side.
stages: [check, build]

# Branch and tag pipelines only. Without this, the rules: on build-and-test makes GitLab start
# merge-request pipelines, which silently leave out every job that has no rules (lint).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: always

default:
  interruptible: true # A newer push cancels this pipeline's unfinished jobs: the shared runner is busiest exactly when pushes come quickly.

variables:
  GIT_DEPTH: "1"   # nothing needs history; keeps the media blobs out of old commits off the wire

lint:
  stage: check
  interruptible: false # on master, a newer push must not cancel the gate run for the push before it
  image: python:3.12-alpine
  before_script:
    - apk add --no-cache git
  script:
    - python3 tools/check-secrets.py --all
    - python3 tools/check-apps2samsung.py
    - python3 -m py_compile tools/*.py decoder-selftest/*.py
    # Ratchet (tools/quality_gate.py): a change may not leave the repo worse than the commit it builds
    # on. Branches are judged against master, pushes to master against the previous tip; a tag points
    # at a commit already judged. The clone is shallow, so deepen until the base is reachable (the
    # gate fails closed if it never is). It runs the base's copy of the gate, so a change cannot
    # loosen the rules it is judged by; only the change that first adds the gate runs its own.
    - |
      if [ -z "$CI_COMMIT_TAG" ]; then
        D="$CI_DEFAULT_BRANCH"
        if [ "$CI_COMMIT_BRANCH" = "$D" ]; then BASE="$CI_COMMIT_BEFORE_SHA"; else BASE="origin/$D"; fi
        case "$BASE" in ""|0000000000000000000000000000000000000000) BASE="HEAD~1" ;; esac
        git fetch -q --depth=50 origin "+refs/heads/$D:refs/remotes/origin/$D"
        for i in 1 2 3 4 5; do
          git merge-base "$BASE" HEAD >/dev/null 2>&1 && break
          git fetch -q --deepen=200 origin "+refs/heads/$D:refs/remotes/origin/$D" "+refs/heads/$CI_COMMIT_BRANCH:refs/remotes/origin/$CI_COMMIT_BRANCH"
        done
        MB=$(git merge-base "$BASE" HEAD) && git show "$MB:tools/quality_gate.py" > /tmp/quality_gate.py 2>/dev/null \
          || cp tools/quality_gate.py /tmp/quality_gate.py
        python3 /tmp/quality_gate.py --base "$BASE"
      fi

build-and-test:
  stage: build
  needs: []        # run alongside lint instead of after it
  rules:           # docs/media-only changes skip the .NET build
    - if: $CI_COMMIT_TAG
    - changes:
        - TizenAmbilight/**/*
        - decoder-selftest/**/*
        - packaging/**/*
        - .gitlab-ci.yml
  image: mcr.microsoft.com/dotnet/sdk:8.0
  variables:
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    DOTNET_NOLOGO: "1"
  script:
    - dotnet run --project decoder-selftest/DecoderSelfTest.csproj
    - dotnet msbuild TizenAmbilight/TizenAmbilight.csproj -restore -t:Rebuild -p:Configuration=Release -v:m
    - mkdir -p dist && cp TizenAmbilight/bin/Release/tizen90/*.tpk dist/
  artifacts:
    name: "TizenAmbilight-$CI_COMMIT_SHORT_SHA"
    paths: [dist/*.tpk]
    expire_in: 30 days
